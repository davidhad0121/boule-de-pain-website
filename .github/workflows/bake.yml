# Copies what was published in the admin panel into the website's own files
# (assets/js/site-config.js and assets/js/menu-data.js).
# The website already shows new changes right away (assets/js/live-data.js asks the panel);
# this makes them permanent in the files, so the pages, the chatbot and anyone reading the files agree.
name: Copy admin panel changes into the files
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  # also right away when this copying script itself changes
  push:
    branches: [main]
    paths: [".github/workflows/bake.yml", "tools/bake.mjs"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bake
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Copy the latest published version
        id: bake
        run: node tools/bake.mjs
      - name: Save the changes
        run: |
          if git diff --quiet -- assets/js/site-config.js assets/js/menu-data.js; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "Boule de Pain admin panel"
          git config user.email "bouledepain-admin@users.noreply.github.com"
          git add assets/js/site-config.js assets/js/menu-data.js
          git commit -m "Publish admin panel changes (version ${{ steps.bake.outputs.version }})"
          git push
